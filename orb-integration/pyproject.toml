[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orb-integration"
version = "0.1.0"
description = "Unified AI integration system blending Claude, GitHub, Copilot, and Hugging Face"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Anthropic Quickstarts"}
]
license = {text = "MIT"}
dependencies = [
    "anthropic>=0.39.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
